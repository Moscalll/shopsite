# 复制为 config.yaml 后修改。敏感信息用 tools/.env（MYSQL_*）

merchant_id: 467

allowed_category_ids: [1, 2, 3, 4, 5, 6, 7, 8]

# 全局默认：每个类目生成几条（当未使用下面两种「按类目」配置时）。
# 本流水线「理论总条数」= 对 allowed_category_ids 逐项求和；要 16 条而共 8 个类目时，
# 可设 items_per_category: 2，或用 items_per_category_each / items_per_category_by_id。
items_per_category: 1

# 二选一（与 items_per_category 互斥扩展，不要与 items_per_category_by_id 同时写）：
# 与 allowed_category_ids「顺序一一对应」的条数，例如 8 个类目分别要 2,1,1,3,1,1,1,2 条：
# items_per_category_each: [2, 1, 1, 3, 1, 1, 1, 2]
#
# 或按类目 id 单独指定条数（未写到的 id 仍用上面的 items_per_category）：
# items_per_category_by_id:
#   1: 3
#   5: 2

price:
  min: 19.0
  max: 599.0

stock_default: 100

defaults:
  stylePreset: english_minimal_wood_table_3x4
  outputFormat: webp

llm:
  # 推荐（Windows）：使用已安装的 Ollama，无需 pip 编译 llama-cpp-python
  # 终端执行: ollama pull qwen2.5:3b   （或你选择的中文指令微调模型）
  backend: http
  base_url: "http://127.0.0.1:11434/v1"
  # api_key 留空即可（Ollama 本地多数无需 Authorization）；若服务端要求再填
  remote_model: "qwen2.5:3b"

  temperature: 0.65
  # 含长英文 fullPromptEn 的 JSON 需要足够输出上限；脚本内对 HTTP/GGUF 另有下限 1200（避免 yaml 写太小被截断）
  max_tokens: 1400
  # fullPromptEn 英文字符数硬下限（默认 200；小模型可试 180，大模型可提高到 240）
  # min_full_prompt_en_chars: 200
  # 同一类目槽位内：校验失败则让 LLM 继续返工，最多调用次数（达到后仍失败则整脚本退出）
  max_attempts_per_slot: 40
  # 兼容旧配置：仅当未写 max_attempts_per_slot 时生效，且实际次数为 max(本值, 25)
  max_retries_per_slot: 3

  # --- 可选：本机 GGUF + llama-cpp-python（仅当 pip 能成功安装时再启用）---
  # backend: gguf
  # model_path: "D:/GitHub/StoryWithYou/resources/models/qwen2.5-3b-instruct-q4_k_m.gguf"
  # n_ctx: 8192
  # n_gpu_layers: 0

paths:
  out_dir: out/pipeline_run
