<section th:fragment="body">
    
    <div class="banner-wrap mb-5">
        <!-- 悬浮公告：不随图片滚动，文案随轮播切换 -->
        <div id="bannerAnnouncement"
             class="alert bg-light-subtle text-center text-muji-dark mb-0 banner-announcement"
             role="alert">
            <span class="me-2">📢</span>
            <strong>店铺公告：</strong>
            <span id="bannerAnnouncementText">全场新品 7 折限时优惠，活动截止至本周末！</span>
        </div>

        <div id="mujiCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner" style="border-radius: 5px;">
            <div th:each="banner, iterStat : ${banners}" 
                 th:classappend="${iterStat.first} ? 'active'" 
                 class="carousel-item"
                 th:attr="data-announcement=${banner.announcement} ?: (${banner.description} ?: ${banner.title})">
                
                <img th:src="@{${banner.imageUrl}}" 
                     class="d-block w-100" 
                     th:alt="${banner.title}" 
                     style="height: 400px; object-fit: cover;">
                
                <div class="carousel-caption d-none d-md-block text-dark" style="background-color: rgba(255, 255, 255, 0.7); border-radius: 5px; color: #333333 !important;">
                    <h5 th:text="${banner.title}">简约生活，从这里开始</h5>
                    <p th:text="${banner.description}"></p>
                </div>
            </div>
             <div th:if="${#lists.isEmpty(banners)}" class="carousel-item active">
                 <img src="https://via.placeholder.com/1200x400/E8E8E8/333333?text=Placeholder+Banner" class="d-block w-100" alt="Placeholder Banner" style="height: 400px; object-fit: cover;">
            </div>
            </div>
        </div>

        <style>
            .banner-wrap { position: relative; }
            .banner-announcement{
                position: absolute;
                top: 12px;
                left: 12px;
                right: 12px;
                z-index: 5;
                border: 1px solid #D3D3D3;
                backdrop-filter: blur(3px);
                background-color: rgba(248,249,250,0.92);
            }
            /* 给轮播留一点顶部空间，避免公告遮挡按钮/字幕 */
            #mujiCarousel .carousel-inner { padding-top: 46px; }
        </style>

        <script th:inline="javascript">
            /*<![CDATA[*/
            (function(){
                var carouselEl = document.getElementById('mujiCarousel');
                var textEl = document.getElementById('bannerAnnouncementText');
                if (!carouselEl || !textEl) return;

                function syncFromActive(){
                    var active = carouselEl.querySelector('.carousel-item.active');
                    if (!active) return;
                    var msg = active.getAttribute('data-announcement');
                    if (msg && msg.trim()) textEl.textContent = msg.trim();
                }

                carouselEl.addEventListener('slid.bs.carousel', function(){ syncFromActive(); });
                syncFromActive();
            })();
            /*]]>*/
        </script>
    </div>
    
    <div class="row mb-5">
        <div class="col-12 text-center mb-4">
            <h2 class="text-muji-dark">| 优选商品 |</h2>
            <hr class="w-25 mx-auto" style="border-top: 2px solid #A5B699;">
        </div>
    </div>
    
    <div class="row g-4 mb-5">
        <div class="col-12">
            <h3 class="mb-4 text-muji-dark">本周特集</h3>
        </div>
        
        <div class="col-lg-3 col-md-6" th:each="item : ${featuredItems}">
            <div class="card h-100 shadow-sm border-0">
                <img th:src="@{${item.imageUrl}}" class="card-img-top" th:alt="${item.name}" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${item.name}">特集商品名</h5>
                    <p class="card-text text-muted" th:text="${item.price}">¥99.00</p>
                    <a th:href="@{/product/{id}(id=${item.id})}" class="btn btn-outline-dark btn-sm">查看详情</a>
                </div>
            </div>
        </div>
        
        <div class="col-12" th:if="${#lists.isEmpty(featuredItems)}">
            <p class="text-center text-muted">本周特集正在准备中...</p>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-12">
            <h3 class="mb-4 text-muji-dark">新品上市</h3>
        </div>
        <div class="col-12">
             <a th:href="@{/new}" class="btn btn-light w-100" style="border: 1px solid #A5B699;">查看所有新品 <i class="bi bi-arrow-right"></i></a>
        </div>
    </div>
    
    <div class="row g-4 mb-5">
        <div class="col-12">
            <h3 class="mb-4 text-muji-dark">热销排行榜</h3>
        </div>
         <div class="col-12">
             <a th:href="@{/top-sellers}" class="btn btn-light w-100" style="border: 1px solid #A5B699;">查看完整榜单 <i class="bi bi-arrow-right"></i></a>
        </div>
    </div>
    
</section>
