<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '用户详情'">用户详情</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body th:replace="admin/layout :: layout(~{::content})">

<div th:fragment="content">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">错误</div>

    <div th:if="${user}">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="mb-1">用户详情</h1>
                <div class="text-muted">普通用户（CUSTOMER）管理</div>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/admin/users}">返回用户列表</a>
                <form th:action="@{/admin/users/{id}/toggle-enabled(id=${user.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn"
                            th:classappend="${user.enabled} ? ' btn-warning' : ' btn-success'"
                            th:text="${user.enabled} ? '注销(禁用)' : '恢复启用'">注销</button>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">用户信息</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4"><strong>ID：</strong><span th:text="${user.id}">1</span></div>
                    <div class="col-md-4"><strong>用户名：</strong><span th:text="${user.username}">u</span></div>
                    <div class="col-md-4"><strong>邮箱：</strong><span th:text="${user.email}">e</span></div>
                    <div class="col-md-4"><strong>角色：</strong><span class="badge bg-secondary" th:text="${user.role}">CUSTOMER</span></div>
                    <div class="col-md-4"><strong>状态：</strong>
                        <span class="badge" th:classappend="${user.enabled} ? ' bg-success' : ' bg-secondary'"
                              th:text="${user.enabled} ? '启用' : '已注销'">启用</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">登录信息</div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr><th>时间</th><th>IP 地址</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${loginLogs}">
                        <td th:text="${l.loginTime != null ? #temporals.format(l.loginTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                        <td th:text="${l.ip != null ? l.ip : '-'}">-</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(loginLogs)}">
                        <td colspan="2" class="text-center text-muted py-3">暂无登录记录</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">浏览行为（商品类别、停留时长）</div>
            <div class="card-body p-0 admin-user-behavior-scroll">
                <table class="table table-hover mb-0 admin-user-behavior-table">
                    <thead class="table-light">
                    <tr><th>时间</th><th>商品类别</th><th>停留时长（秒）</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="b : ${behaviorLogs}">
                        <td th:text="${b.eventTime != null ? #temporals.format(b.eventTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                        <td th:text="${categoryNames != null and b.categoryId != null and categoryNames.containsKey(b.categoryId)} ? ${categoryNames.get(b.categoryId)} : '-'">-</td>
                        <td th:text="${b.durationSeconds != null ? b.durationSeconds : '-'}">0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(behaviorLogs)}">
                        <td colspan="3" class="text-center text-muted py-3">暂无浏览行为记录（客户需在商品详情页退出或切换页面后上报停留时长）</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <style>
            .admin-user-behavior-scroll {
                max-height: 420px;
                overflow-y: auto;
            }
            .admin-user-behavior-table thead th {
                position: sticky;
                top: 0;
                z-index: 2;
                background: #f8f9fa;
            }
        </style>

        <div class="card">
            <div class="card-header">订单列表</div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr><th>订单ID</th><th>状态</th><th>金额</th><th>下单时间</th><th style="width:360px;">操作</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="o : ${orders}">
                        <td>
                            <a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="${o.id}">1</a>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${o.status.name() == 'PENDING_PAYMENT'} ? 'bg-warning' :
                                                  (${o.status.name() == 'PROCESSING'} ? 'bg-info' :
                                                  (${o.status.name() == 'SHIPPED'} ? 'bg-primary' :
                                                  (${o.status.name() == 'DELIVERED'} ? 'bg-success' :
                                                  (${o.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-secondary'))))">
                                <span th:switch="${o.status.name()}">
                                    <span th:case="'PENDING_PAYMENT'">待付款</span>
                                    <span th:case="'PROCESSING'">处理中</span>
                                    <span th:case="'SHIPPED'">已发货</span>
                                    <span th:case="'DELIVERED'">已送达</span>
                                    <span th:case="'COMPLETED'">已完成</span>
                                    <span th:case="'CANCELLED'">已取消</span>
                                </span>
                            </span>
                        </td>
                        <td>¥<span th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 2, 'POINT')}">0.00</span></td>
                        <td th:text="${o.orderDate != null ? #temporals.format(o.orderDate, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                        <td>
                            <form th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post" class="d-inline-flex gap-2">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <select class="form-select form-select-sm" name="status">
                                    <option th:each="st : ${T(com.example.shopsite.model.OrderStatus).values()}"
                                            th:value="${st}" th:selected="${st} == ${o.status}"
                                            th:text="${st.name() == 'PENDING_PAYMENT' ? '待付款' : (st.name() == 'PROCESSING' ? '处理中' : (st.name() == 'SHIPPED' ? '已发货' : (st.name() == 'DELIVERED' ? '已送达' : (st.name() == 'COMPLETED' ? '已完成' : (st.name() == 'CANCELLED' ? '已取消' : st.name())))))}">
                                        状态
                                    </option>
                                </select>
                                <button class="btn btn-sm btn-outline-primary" type="submit">更新</button>
                            </form>

                            <form th:action="@{/admin/orders/{id}/cancel(id=${o.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-sm btn-outline-warning" type="submit">取消</button>
                            </form>

                            <form th:action="@{/admin/orders/{id}/delete(id=${o.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('确认删除该订单？此操作不可恢复');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="5" class="text-center text-muted py-3">暂无订单</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
