<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '用户管理'">用户管理</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body th:replace="admin/layout :: layout(~{::content})">

<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h1 class="mb-1">用户管理</h1>
            <div class="text-muted">查看并管理平台用户角色</div>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}">操作成功</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">操作失败</div>

    <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-center mb-3">
        <div class="col-sm-6 col-md-4">
            <input class="form-control" name="keyword" placeholder="搜索用户名/邮箱" th:value="${keyword ?: ''}">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">搜索</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/admin/users}">重置</a>
        </div>
    </form>

    <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
            <span>用户列表</span>
            <span class="text-muted">共 <span th:text="${#lists.size(users)}">0</span> 人</span>
        </div>
        <div class="card-body p-0">
            <div style="max-height: 420px; overflow:auto;">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 90px;">ID</th>
                        <th>用户名</th>
                        <th>邮箱</th>
                        <th style="width: 140px;">状态</th>
                        <th style="width: 280px;">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.username}">user</td>
                        <td th:text="${u.email}">user@example.com</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.enabled} ? ' bg-success' : ' bg-secondary'"
                                  th:text="${u.enabled} ? '启用' : '已注销'">启用</span>
                        </td>
                        <td>
                            <div class="d-flex gap-2 flex-wrap">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}(id=${u.id})}">详情</a>

                                <form th:action="@{/admin/users/{id}/toggle-enabled(id=${u.id})}" method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button class="btn btn-sm"
                                            th:classappend="${u.enabled} ? ' btn-outline-warning' : ' btn-outline-success'"
                                            th:text="${u.enabled} ? '注销' : '恢复'">注销</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5" class="text-center text-muted py-4">暂无用户</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
