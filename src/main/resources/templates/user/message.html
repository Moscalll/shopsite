<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '消息中心'">消息中心</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div th:replace="index/fragments :: navbar"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>消息中心</h1>
            <div>
                <form th:action="@{/message/read-all}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-outline-primary btn-sm" 
                            th:if="${mode == 'user' and unreadCount > 0}">
                        全部标记为已读 (<span th:text="${unreadCount}">0</span>)
                    </button>
                </form>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}">成功</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">错误</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 商户模式：订单待办 -->
        <div th:if="${mode == 'merchant'}">
            <style>
                .scroll-table { max-height: 320px; overflow-y: auto; }
                .scroll-table table { margin-bottom: 0; }
                /* 解决下拉菜单被滚动容器裁剪：打开时临时解除裁剪 */
                .scroll-table.dropdown-open { overflow: visible; }

                /* 取消悬浮效果与动效：鼠标移到表格区域不发生变化 */
                .merchant-message-center .card,
                .merchant-message-center .card * {
                    transition: none !important;
                    animation: none !important;
                }
                .merchant-message-center .card:hover {
                    transform: none !important;
                    box-shadow: none !important;
                }
                .merchant-message-center table tbody tr:hover {
                    background-color: inherit !important;
                }
                .merchant-message-center .dropdown-menu {
                    transition: none !important;
                    animation: none !important;
                }
            </style>

            <script>
                document.addEventListener('show.bs.dropdown', function (e) {
                    var scroller = e.target && e.target.closest ? e.target.closest('.scroll-table') : null;
                    if (scroller) scroller.classList.add('dropdown-open');
                });
                document.addEventListener('hide.bs.dropdown', function (e) {
                    var scroller = e.target && e.target.closest ? e.target.closest('.scroll-table') : null;
                    if (scroller) scroller.classList.remove('dropdown-open');
                });
            </script>

            <div class="merchant-message-center">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>待发货</strong>
                    <span class="badge bg-danger" th:if="${pendingShipCount > 0}" th:text="${pendingShipCount}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="scroll-table">
                        <table class="table mb-0 align-middle">
                            <thead class="table-light">
                            <tr><th>订单号</th><th>客户</th><th>下单时间</th><th>状态</th><th>操作</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${pendingShip}">
                                <td th:text="${order.id}">1</td>
                                <td th:text="${order.user.username}">用户名</td>
                                <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">-</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${order.status.name() == 'PENDING_PAYMENT'} ? 'bg-warning' :
                                                          (${order.status.name() == 'PROCESSING'} ? 'bg-info' :
                                                          (${order.status.name() == 'SHIPPED'} ? 'bg-primary' :
                                                          (${order.status.name() == 'DELIVERED'} ? 'bg-success' :
                                                          (${order.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-secondary'))))">
                                        <span th:switch="${order.status.name()}">
                                            <span th:case="'PENDING_PAYMENT'">待付款</span>
                                            <span th:case="'PROCESSING'">处理中</span>
                                            <span th:case="'SHIPPED'">已发货</span>
                                            <span th:case="'DELIVERED'">已送达</span>
                                            <span th:case="'COMPLETED'">已完成</span>
                                            <span th:case="'CANCELLED'">已取消</span>
                                        </span>
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/merchant/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">详情</a>
                                        <form th:action="@{/merchant/orders/{id}/ship(id=${order.id})}" method="post"
                                              th:if="${order.status.name() == 'PROCESSING'}" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-success" onclick="return confirm('确认发货？')">发货</button>
                                        </form>
                                        <form th:action="@{/merchant/orders/{id}/cancel(id=${order.id})}" method="post"
                                              th:if="${order.status.name() == 'PENDING_PAYMENT' or order.status.name() == 'PROCESSING'}" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('确认取消该订单？')">取消</button>
                                        </form>
                                        <div class="dropdown d-inline">
                                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-boundary="viewport">
                                                修改状态
                                            </button>
                                            <ul class="dropdown-menu">
                                                <li>
                                                    <form th:action="@{/merchant/orders/{id}/update-status(id=${order.id})}" method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="status" value="PROCESSING" />
                                                        <button type="submit" class="dropdown-item">处理中</button>
                                                    </form>
                                                </li>
                                                <li>
                                                    <form th:action="@{/merchant/orders/{id}/update-status(id=${order.id})}" method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="status" value="SHIPPED" />
                                                        <button type="submit" class="dropdown-item">已发货</button>
                                                    </form>
                                                </li>
                                                <li>
                                                    <form th:action="@{/merchant/orders/{id}/update-status(id=${order.id})}" method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="status" value="DELIVERED" />
                                                        <button type="submit" class="dropdown-item">已送达</button>
                                                    </form>
                                                </li>
                                                <li>
                                                    <form th:action="@{/merchant/orders/{id}/update-status(id=${order.id})}" method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="status" value="COMPLETED" />
                                                        <button type="submit" class="dropdown-item">已完成</button>
                                                    </form>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pendingShip)}"><td colspan="5" class="text-center text-muted py-3">暂无待发货订单</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>待送达</strong>
                    <span class="badge bg-danger" th:if="${pendingDeliverCount > 0}" th:text="${pendingDeliverCount}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="scroll-table">
                        <table class="table mb-0 align-middle">
                            <thead class="table-light">
                            <tr><th>订单号</th><th>客户</th><th>下单时间</th><th>状态</th><th>操作</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${pendingDeliver}">
                                <td th:text="${order.id}">1</td>
                                <td th:text="${order.user.username}">用户名</td>
                                <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">-</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${order.status.name() == 'PENDING_PAYMENT'} ? 'bg-warning' :
                                                          (${order.status.name() == 'PROCESSING'} ? 'bg-info' :
                                                          (${order.status.name() == 'SHIPPED'} ? 'bg-primary' :
                                                          (${order.status.name() == 'DELIVERED'} ? 'bg-success' :
                                                          (${order.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-secondary'))))">
                                        <span th:switch="${order.status.name()}">
                                            <span th:case="'PENDING_PAYMENT'">待付款</span>
                                            <span th:case="'PROCESSING'">处理中</span>
                                            <span th:case="'SHIPPED'">已发货</span>
                                            <span th:case="'DELIVERED'">已送达</span>
                                            <span th:case="'COMPLETED'">已完成</span>
                                            <span th:case="'CANCELLED'">已取消</span>
                                        </span>
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/merchant/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">详情</a>
                                        <form th:action="@{/merchant/orders/{id}/cancel(id=${order.id})}" method="post"
                                              th:if="${order.status.name() == 'PENDING_PAYMENT' or order.status.name() == 'PROCESSING'}" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('确认取消该订单？')">取消</button>
                                        </form>
                                        <div class="dropdown d-inline">
                                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-boundary="viewport">
                                                修改状态
                                            </button>
                                            <ul class="dropdown-menu">
                                                <li>
                                                    <form th:action="@{/merchant/orders/{id}/update-status(id=${order.id})}" method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="status" value="DELIVERED" />
                                                        <button type="submit" class="dropdown-item">已送达</button>
                                                    </form>
                                                </li>
                                                <li>
                                                    <form th:action="@{/merchant/orders/{id}/update-status(id=${order.id})}" method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="status" value="COMPLETED" />
                                                        <button type="submit" class="dropdown-item">已完成</button>
                                                    </form>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pendingDeliver)}"><td colspan="5" class="text-center text-muted py-3">暂无待送达订单</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>待确认</strong>
                    <span class="badge bg-danger" th:if="${pendingConfirmCount > 0}" th:text="${pendingConfirmCount}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="scroll-table">
                        <table class="table mb-0 align-middle">
                            <thead class="table-light">
                            <tr><th>订单号</th><th>客户</th><th>下单时间</th><th>状态</th><th>操作</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${pendingConfirm}">
                                <td th:text="${order.id}">1</td>
                                <td th:text="${order.user.username}">用户名</td>
                                <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">-</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${order.status.name() == 'PENDING_PAYMENT'} ? 'bg-warning' :
                                                          (${order.status.name() == 'PROCESSING'} ? 'bg-info' :
                                                          (${order.status.name() == 'SHIPPED'} ? 'bg-primary' :
                                                          (${order.status.name() == 'DELIVERED'} ? 'bg-success' :
                                                          (${order.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-secondary'))))">
                                        <span th:switch="${order.status.name()}">
                                            <span th:case="'PENDING_PAYMENT'">待付款</span>
                                            <span th:case="'PROCESSING'">处理中</span>
                                            <span th:case="'SHIPPED'">已发货</span>
                                            <span th:case="'DELIVERED'">已送达</span>
                                            <span th:case="'COMPLETED'">已完成</span>
                                            <span th:case="'CANCELLED'">已取消</span>
                                        </span>
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/merchant/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">详情</a>
                                        <form th:action="@{/merchant/orders/{id}/cancel(id=${order.id})}" method="post"
                                              th:if="${order.status.name() == 'PENDING_PAYMENT' or order.status.name() == 'PROCESSING'}" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('确认取消该订单？')">取消</button>
                                        </form>
                                        <div class="dropdown d-inline">
                                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-boundary="viewport">
                                                修改状态
                                            </button>
                                            <ul class="dropdown-menu">
                                                <li>
                                                    <form th:action="@{/merchant/orders/{id}/update-status(id=${order.id})}" method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="status" value="PROCESSING" />
                                                        <button type="submit" class="dropdown-item">处理中</button>
                                                    </form>
                                                </li>
                                                <li>
                                                    <form th:action="@{/merchant/orders/{id}/update-status(id=${order.id})}" method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="status" value="CANCELLED" />
                                                        <button type="submit" class="dropdown-item">已取消</button>
                                                    </form>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pendingConfirm)}"><td colspan="5" class="text-center text-muted py-3">暂无待确认订单</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            </div>
        </div>

        <!-- 普通用户模式：消息列表 -->
        <div th:if="${mode != 'merchant' and #lists.isEmpty(messages)}" class="text-center py-5">
            <p class="text-muted">暂无消息</p>
        </div>

        <div th:if="${mode != 'merchant' and !#lists.isEmpty(messages)}" class="list-group">
            <div class="list-group-item" th:each="message : ${messages}" 
                 th:classappend="${!message.isRead} ? 'list-group-item-warning' : ''">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <p class="mb-1" th:text="${message.content}">消息内容</p>
                        <small class="text-muted" th:text="${#temporals.format(message.createTime, 'yyyy-MM-dd HH:mm:ss')}">
                            2025-01-01 12:00:00
                        </small>
                        <a th:href="@{/orders/{id}(id=${message.relatedOrderId})}" 
                           th:if="${message.relatedOrderId != null}"
                           class="btn btn-sm btn-outline-primary ms-2">查看订单</a>
                    </div>
                    <div>
                        <form th:action="@{/message/{id}/read(id=${message.id})}" method="post" 
                              th:if="${!message.isRead}" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-sm btn-outline-secondary">标记已读</button>
                        </form>
                        <span th:if="${message.isRead}" class="badge bg-success">已读</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="index/fragments :: footer"></div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
