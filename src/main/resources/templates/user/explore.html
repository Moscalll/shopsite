<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '逛一逛'">逛一逛</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <style>
        .explore-card img { height: 160px; object-fit: cover; }
        .explore-placeholder { height: 160px; background: #f1f3f5; border: 1px dashed #ced4da; }
        .explore-sticky-topbar { position: sticky; top: 0px; z-index: 10; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px); }
    </style>
</head>
<body>
<div th:replace="index/fragments :: navbar"></div>

<main class="container-fluid px-3 py-0">
    <div class="explore-sticky-topbar py-2 mb-3 border-bottom">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h4 mb-0">逛一逛</h1>
                <div class="text-muted small">竖向图片流 · 最多20行 · 底部可刷新“看看别的”</div>
            </div>
            <a class="btn btn-outline-dark btn-sm" th:href="@{/explore(seed=${nextSeed})}">换一批</a>
        </div>
    </div>

    <div class="row g-2">
        <div class="col-2" th:each="it : ${feed}">
            <div class="card explore-card border-0 shadow-sm h-100" th:if="${it != null}">
                <img class="card-img-top" th:src="${it.imageUrl ?: '/images/placeholder.jpg'}" th:alt="${it.name}">
                <div class="card-body p-2 d-flex flex-column">
                    <div class="fw-semibold small text-truncate" th:title="${it.name}" th:text="${it.name}">商品名称</div>
                    <div class="text-danger small fw-bold">¥<span th:text="${#numbers.formatDecimal(it.price, 0, 'COMMA', 2, 'POINT')}">99.00</span></div>
                    <a class="btn btn-outline-dark btn-sm mt-auto"
                       th:href="@{/product/{id}(id=${it.id}, returnUrl=${'/explore?seed=' + seed})}">查看</a>
                </div>
            </div>
            <div class="card border-0 h-100" th:if="${it == null}">
                <div class="explore-placeholder rounded"></div>
                <div class="p-2">
                    <div class="small text-muted">测试占位</div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center text-muted small py-4">
        <div class="mb-2">到底了</div>
        <a class="btn btn-light btn-sm" style="border: 1px solid #A5B699;" th:href="@{/explore(seed=${nextSeed})}">
            看看别的 <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</main>

<div th:replace="index/fragments :: footer"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
